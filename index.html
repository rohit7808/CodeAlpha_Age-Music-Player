<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeAlpha - Web Music Player</title>
    <meta name="description" content="A modern, high-quality, web-based music player.">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-music logo-icon"></i>
                <h1>CodeAlpha Music</h1>
            </div>
            
            <div class="sidebar-section">
                <div class="menu-item active" id="nav-library">
                    <i class="fa-solid fa-house"></i>
                    <span>Library</span>
                </div>
                <div class="menu-item" id="nav-search-btn">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <span>Search</span>
                </div>
            </div>

            <div class="sidebar-section playlists-section">
                <div class="section-header">
                    <h2>PLAYLISTS</h2>
                    <button id="add-playlist-btn" title="Create Playlist"><i class="fa-solid fa-plus"></i></button>
                </div>
                <div class="playlist-list" id="playlist-list">
                    <!-- Playlists will be rendered here -->
                </div>
            </div>

            <div class="sidebar-footer">
                <button id="theme-toggle" class="theme-toggle">
                    <i class="fa-solid fa-sun" id="theme-icon"></i>
                    <span id="theme-text">Light Mode</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="main-header">
                <div class="search-bar" id="search-bar-container" style="display: none;">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="Search songs, artists...">
                </div>
                
                <div class="header-actions">
                    <label for="file-upload" class="upload-btn">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        Upload Local Music
                    </label>
                    <input type="file" id="file-upload" multiple accept=".mp3,audio/mpeg,audio/wav,audio/ogg" style="display: none;">
                </div>
            </header>

            <div class="content-view">
                <div class="view-header">
                    <h1 id="current-view-title">All Songs</h1>
                    <span id="current-view-count">0 songs</span>
                    <button class="play-all-btn" id="play-all-btn" style="display: none;">
                         <i class="fa-solid fa-play"></i> Play
                    </button>
                </div>
                
                <div class="song-list-header">
                    <div class="col-title">TITLE</div>
                    <div class="col-artist">ARTIST</div>
                    <div class="col-duration"><i class="fa-regular fa-clock"></i></div>
                    <div class="col-actions"></div>
                </div>
                
                <div class="song-list" id="song-list">
                    <!-- Songs will be populated here -->
                    <div class="empty-state">
                        <i class="fa-solid fa-compact-disc"></i>
                        <h3>Your library is empty</h3>
                        <p>Upload some local music files to get started. Files are played locally and never leave your device.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Player Bottom Bar -->
    <footer class="player-bar">
        <div class="now-playing" id="now-playing-info">
            <div class="album-art" id="album-art-container">
                <i class="fa-solid fa-music default-art"></i>
                <img id="now-playing-img" src="" alt="Album Art" style="display: none;">
            </div>
            <div class="track-info">
                <h4 id="now-playing-title">No song playing</h4>
                <p id="now-playing-artist">--</p>
            </div>
        </div>

        <div class="player-controls">
            <div class="control-buttons">
                <button class="control-btn small" id="shuffle-btn"><i class="fa-solid fa-shuffle"></i></button>
                <button class="control-btn" id="prev-btn"><i class="fa-solid fa-backward-step"></i></button>
                <button class="control-btn play-btn" id="play-pause-btn"><i class="fa-solid fa-circle-play"></i></button>
                <button class="control-btn" id="next-btn"><i class="fa-solid fa-forward-step"></i></button>
                <button class="control-btn small" id="repeat-btn"><i class="fa-solid fa-repeat"></i></button>
            </div>
            
            <div class="progress-container">
                <span id="current-time">0:00</span>
                <div class="progress-wrapper" id="progress-wrapper">
                    <div class="progress-bar-fill" id="progress-fill"></div>
                    <input type="range" id="progress-slider" min="0" max="100" value="0" step="0.1" class="slider">
                </div>
                <span id="total-time">0:00</span>
            </div>
        </div>

        <div class="player-extras">
            <div class="volume-container">
                <i class="fa-solid fa-volume-high" id="volume-icon"></i>
                <input type="range" id="volume-slider" min="0" max="100" value="100" class="slider volume-slider">
            </div>
        </div>
    </footer>

    <!-- Playlist Modal -->
    <div class="modal-overlay" id="playlist-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">Add to Playlist</h3>
                <button id="close-modal"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body" id="modal-playlist-list">
                <!-- Playlists for adding song -->
            </div>
            <div class="modal-footer">
                <input type="text" id="new-playlist-input" placeholder="New playlist name...">
                <button id="create-playlist-btn" class="primary-btn">Create</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div class="toast" id="toast"></div>

    <script src="script.js"></script>
</body>
</html>
